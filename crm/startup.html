<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'">
  <title>Ploa</title>
  <style>
    :root { color-scheme:dark; font-family:'Segoe UI',Arial,sans-serif; background:#050a10; color:#e9f2ff; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(ellipse at 50% 30%,#10293e,transparent 65%); }
    main { width:min(390px,calc(100% - 48px)); text-align:center; padding:40px 0; }
    img { width:76px; height:76px; object-fit:contain; margin-bottom:22px; }
    h1 { margin:0 0 12px; font-size:26px; font-weight:600; }
    p { color:#b0c2d6; line-height:1.6; font-size:15px; margin:0 0 22px; }
    .pulse { width:100px; height:3px; background:#18354d; margin:24px auto; border-radius:8px; overflow:hidden; }
    .pulse::after { content:''; display:block; height:100%; width:42%; background:#8bc3ff; animation:progress 1.3s ease-in-out infinite alternate; }
    #unavailable { display:none; }
    #unavailable:target { display:block; }
    body:has(#unavailable:target) #loading { display:none; }
    a { display:inline-block; color:#e1efff; border:1px solid #406486; padding:11px 20px; border-radius:9px; text-decoration:none; font-size:14px; }
    a:hover { background:#153047; } a:focus-visible { outline:2px solid #a4d1ff; outline-offset:4px; }
    @keyframes progress { to { transform:translateX(138%); } }
    @media(prefers-reduced-motion:reduce) { .pulse::after { animation:none; width:100%; } }
  </style>
</head>
<body>
  <main>
    <img src="public/assets/ploa-logo-transparent.png" alt="Ploa">
    <section id="loading" role="status">
      <h1>Abrindo o Ploa</h1>
      <p>Preparando seu painel. Isso pode levar alguns instantes.</p>
      <div class="pulse" aria-hidden="true"></div>
    </section>
    <section id="unavailable" role="alert">
      <h1>O painel não terminou de abrir</h1>
      <p>Não foi possível concluir o carregamento. Tente novamente nesta janela.</p>
      <a href="http://127.0.0.1:4310/">Tentar novamente</a>
    </section>
  </main>
</body>
</html>
